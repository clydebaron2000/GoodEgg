name: Deploy EggTrack to GitHub Pages

on:
  push:
    branches:
      - main

# Allow this workflow to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Apps Script URL from secret
        run: |
          sed -i "s|YOUR_APPS_SCRIPT_URL_HERE|${{ secrets.SCRIPT_URL }}|g" eggtrack.html

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
